name: iPhone Duo watch

on:
  schedule:
    # Every 20 minutes while the tracker is collecting (6:30 AM–9:30 PM Eastern),
    # written in UTC and wide enough to cover both daylight and standard time.
    # :17/:37/:57 lands a few minutes after each tracker check finishes.
    - cron: "17,37,57 0-2,10-23 * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test push instead of checking (to confirm phones are subscribed)"
        type: boolean
        default: false

permissions:
  contents: write # lets the job save state.json so you only get pinged on changes

concurrency:
  group: duo-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check availability
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEND_TEST: ${{ inputs.test_notification }}
        run: python3 watch.py

      - name: Save state if it changed
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update availability state"
            git push
          fi
